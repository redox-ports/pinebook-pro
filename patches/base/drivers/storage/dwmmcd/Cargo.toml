[package]
name = "dwmmcd"
version = "0.1.0"
description = "Synopsys DesignWare MMC (dw_mshc) microSD driver for the Rockchip RK3399"
edition = "2024"
license = "MIT"

[dependencies]
common = { path = "../../common" }
daemon = { path = "../../../daemon" }
